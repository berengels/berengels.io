<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ber Engels — strategie, cultuur en verandering.">
  <meta name="theme-color" content="#f4f1e9">
  <link rel="canonical" href="https://berengels.nl/">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/index.css">
  <title>Ber Engels</title>
</head>
<body>
  <a class="skip-link" href="#inhoud">Naar de inhoud</a>
  <header class="site-header">
    <a class="wordmark" href="#bovenaan" aria-label="Ber Engels, beginpagina">berengels.nl</a>
    <nav aria-label="Hoofdnavigatie">
      <a href="#aanpak">Aanpak</a>
      <a href="#klanten">Klanten</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="inhoud">
    <section class="hero" id="bovenaan" aria-labelledby="hero-title">
      <img class="hero-image" src="./assets/images/redwoods.jpg" alt="Een wandelaar tussen hoge sequoia's" fetchpriority="high">
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="hero-copy">
        <p>Strategie · Cultuur · Verandering</p>
        <h1 id="hero-title">Ber Engels</h1>
      </div>
      <a class="scroll-cue" href="#aanpak" aria-label="Verder naar Aanpak">↓</a>
    </section>

    <section class="approach section" id="aanpak" aria-labelledby="approach-title">
      <div class="section-copy">
        <p class="eyebrow">01 / Aanpak</p>
        <h2 id="approach-title">Aandacht voor wat<br>in beweging komt.</h2>
      </div>
      <img class="section-image mushrooms" src="./assets/images/mushrooms.jpg" alt="Paddenstoelen groeien op een met mos bedekte bosgrond" loading="lazy">
    </section>

    <section class="clients" id="klanten" aria-labelledby="clients-title">
      <img src="./assets/images/mountains.jpg" alt="Berglandschap met bos en wolken" loading="lazy">
      <div class="clients-title">
        <p class="eyebrow">02 / Samenwerkingen</p>
        <h2 id="clients-title">Klanten</h2>
      </div>
    </section>

    <section class="contact section" id="contact" aria-labelledby="contact-title">
      <p class="eyebrow">03 / Contact</p>
      <h2 id="contact-title">Contact</h2>
      <a class="contact-link" href="mailto:website@ber.freedom.nl">website@ber.freedom.nl <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <footer class="site-footer">
    <a class="wordmark" href="#bovenaan">berengels.nl</a>
    <span>© 2026</span>
  </footer>
</body>
</html>
